[project]
name = "lore"
version = "0.1.0"
description = "Lore: a permission-aware company brain on FalkorDB with incident-investigating agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "falkordb>=1.8,<2",
    "google-genai>=2.31,<3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a running FalkorDB with the Kettle graph loaded (skipped otherwise)",
    "live_llm: needs GEMINI_API_KEY (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
