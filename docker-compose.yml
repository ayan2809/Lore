# Lore: Docker Compose (local use). The AWS deployment is described in infra/ instead.
#
#   docker compose up -d falkordb        just the database (run the API with `make api`)
#   docker compose up -d --build         database + API in containers
#
# SECURITY: every published port is bound to 127.0.0.1 (this machine only). FalkorDB (Redis) must never
# be reachable from the public internet. Containers talk to each other over the private compose network.

services:
  falkordb:
    # The "-server" image: the same engine as falkordb/falkordb but without the Browser UI. It is also
    # exactly what runs on AWS (infra/cfn/app.yaml), pinned to the same version.
    image: falkordb/falkordb-server:v4.18.3
    container_name: lore-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # database (Redis protocol)
    volumes:
      - falkordb_data:/var/lib/falkordb/data # keeps the graph when the container restarts
    environment:
      # Optional locally: put LORE_FALKORDB_PASSWORD in .env and both this service and the api use it.
      FALKORDB_PASSWORD: ${LORE_FALKORDB_PASSWORD:-}
      # Replaces the image's "TIMEOUT 1000" (1 s cap per query): 2 s default, 30 s ceiling (the loader's limit).
      FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 2000 TIMEOUT_MAX 30000 RESULTSET_SIZE 10000
    # The image's start script (run.sh) ignores command-line arguments and builds the redis-server command
    # from $REDIS_ARGS, so the password and the journal setting go in there (same as on AWS).
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -n "$$FALKORDB_PASSWORD" ]; then
          export REDIS_ARGS="--requirepass $$FALKORDB_PASSWORD --appendonly yes"
        else
          export REDIS_ARGS="--appendonly yes"
        fi
        exec /var/lib/falkordb/bin/run.sh
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$FALKORDB_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./backend # uses backend/Dockerfile
    container_name: lore-api
    restart: unless-stopped
    env_file:
      - path: .env # the root .env (copy .env.example); optional so the file can be missing
        required: false
    environment:
      # Inside the compose network the database is reachable by its service name.
      LORE_FALKORDB_HOST: falkordb
      LORE_FALKORDB_PORT: "6379"
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/replays:/app/replays # recorded runs for replay mode survive rebuilds

volumes:
  falkordb_data:
